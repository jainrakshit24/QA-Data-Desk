# QA Data Desk behind nginx: HTTPS, security headers, robots.txt, sitemap.xml and a custom 404.
#
#   1. Get a certificate:  certbot certonly --nginx -d qa.example.com
#   2. Replace qa.example.com and the paths below.
#   3. python3 deploy/make_sitemap.py https://qa.example.com
#   4. nginx -t && systemctl reload nginx
#
# Streamlit talks over websockets, so the Upgrade headers below are required, not optional.

# --- every plain HTTP request is redirected; nothing is served over http ---
server {
    listen 80;
    listen [::]:80;
    server_name qa.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qa.example.com;

    ssl_certificate     /etc/letsencrypt/live/qa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # --- security headers -------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    server_tokens off;

    client_max_body_size 32m;

    # --- files served at the domain root ---------------------------------
    location = /robots.txt  { alias /srv/qa_dashboard/static/robots.txt; }
    location = /sitemap.xml { alias /srv/qa_dashboard/static/sitemap.xml; }

    # --- custom 404 -------------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        root /srv/qa_dashboard/deploy;
        internal;
    }

    # --- the app ----------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;       # websockets
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;      # the app warns when this is not https
        proxy_read_timeout 300s;                         # a 60s query plus overhead
        proxy_buffering off;
    }
}
